# Postgres 16 tuning for Treeway on a shared 6 vCPU / 11 GB RAM / NVMe server.
# Put this file in /etc/postgresql/16/main/conf.d/treeway.conf (include_dir 'conf.d' is on by default),
# then: systemctl restart postgresql
#
# Memory budget (11 GB shared with other pm2 apps): Postgres ~3 GB of buffers + per-query work memory,
# Treeway API ~1.5 GB (4 workers), scheduler up to ~1 GB at night, Redis 256 MB, the rest for other apps
# and the OS file cache.

# ---- connections: 4 workers x 10 + scheduler + backups + admin; PgBouncer later can raise the clients
max_connections = 100
superuser_reserved_connections = 3

# ---- memory
shared_buffers = 2560MB
effective_cache_size = 6GB             # what the OS cache + buffers can hold; only a planner hint
work_mem = 16MB                        # per sort / hash, per query; reports and night jobs use a few
maintenance_work_mem = 512MB           # VACUUM, CREATE INDEX
huge_pages = try

# ---- NVMe disk
random_page_cost = 1.1
effective_io_concurrency = 200

# ---- write-ahead log
wal_compression = on
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB

# ---- parallel queries (leave cores for the API workers)
max_worker_processes = 6
max_parallel_workers = 4
max_parallel_workers_per_gather = 2

# ---- autovacuum: the ledgers only grow, so keep statistics fresh
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ---- safety
idle_in_transaction_session_timeout = 60s   # a forgotten open transaction cannot hold locks for long
lock_timeout = 0                             # the app handles waits itself (advisory locks)
timezone = 'UTC'                             # the app turns times into IST itself

# ---- logging (pm2 logs stay small; slow queries go to the Postgres log)
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %u@%d '

# ---- listen only on this machine
listen_addresses = 'localhost'

# One-time setup (as postgres):
#   CREATE ROLE treeway LOGIN PASSWORD '...';
#   CREATE DATABASE treeway OWNER treeway;
#   \c treeway
#   REVOKE ALL ON SCHEMA public FROM PUBLIC; GRANT ALL ON SCHEMA public TO treeway;
# pg_hba.conf: keep only local / 127.0.0.1 / ::1 lines with scram-sha-256 for treeway.
