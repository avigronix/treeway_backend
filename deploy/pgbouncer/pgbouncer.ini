; PgBouncer for Treeway: NOT needed at launch (about 45 connections go straight to Postgres).
; Turn it on when Postgres connections become the limit (more API workers, or other apps need connections).
;
; How Treeway uses it:
;  - The API connects to 127.0.0.1:6432 with DB_STATEMENT_CACHE_SIZE=0 in its .env (transaction pooling
;    cannot keep asyncpg's prepared statements). The API only uses transaction-level advisory locks
;    (pg_advisory_xact_lock), which are safe in transaction mode.
;  - The SCHEDULER keeps DATABASE_URL on 127.0.0.1:5432 (direct): its jobs hold session advisory locks
;    (pg_try_advisory_lock) and server-side cursors, which need one real connection for the whole job.
;    In ecosystem.config.js give the scheduler its own env: DATABASE_URL=...:5432/treeway
;
; Install: apt install pgbouncer; copy this to /etc/pgbouncer/pgbouncer.ini; userlist below; systemctl restart pgbouncer

[databases]
treeway = host=127.0.0.1 port=5432 dbname=treeway

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 400          ; API workers can open many client connections
default_pool_size = 30         ; real Postgres connections for treeway
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 300
query_wait_timeout = 30        ; same limit as the API's statement timeout

ignore_startup_parameters = extra_float_digits
admin_users = postgres
stats_users = treeway
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

; /etc/pgbouncer/userlist.txt (chmod 600, owner postgres):
;   "treeway" "SCRAM-SHA-256$..."   <- copy from: SELECT rolpassword FROM pg_authid WHERE rolname = 'treeway';
