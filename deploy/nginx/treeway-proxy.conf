# Passing a request to gunicorn (included by treeway-api.conf and treeway-web.conf).
proxy_pass http://treeway_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# $remote_addr is the real visitor. The app trusts this header only because TRUST_PROXY=1, and the browser
# cannot set it (we overwrite it). Behind Cloudflare: also include cloudflare-realip.conf in the server block.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 65s;          # gunicorn kills a request at 60 s
proxy_buffering off;             # CSV exports stream to the admin as they are made
