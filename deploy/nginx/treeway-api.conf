# /etc/nginx/sites-available/treeway-api  ->  ln -s ../sites-available/treeway-api /etc/nginx/sites-enabled/
# The API: https://apitreeway.avigronix.com  (gunicorn on 127.0.0.1:8100)
# The app (treeway-web.conf) does NOT call this domain from the browser: it sends /api/ and /uploads/ to the same
# gunicorn itself, so members never need CORS. This domain is for health checks / monitoring and direct API use.
#
# HTTPS certificate: certbot (`sudo certbot --nginx -d apitreeway.avigronix.com`), or a Cloudflare Origin
# Certificate if the domain is behind Cloudflare (then also include the cloudflare-*.conf files, see README).
# Test and load: sudo nginx -t && sudo systemctl reload nginx

upstream treeway_api {
    server 127.0.0.1:8100;
    keepalive 32;
    keepalive_timeout 60s;   # must stay BELOW gunicorn --keep-alive (75), or nginx reuses a closed socket -> 502
}

# Per-IP request cap at the edge (the app also has its own limits in Redis). Shared with treeway-web.conf.
limit_req_zone $binary_remote_addr zone=treeway_api:20m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name apitreeway.avigronix.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }   # certbot
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apitreeway.avigronix.com;

    ssl_certificate     /etc/letsencrypt/live/apitreeway.avigronix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apitreeway.avigronix.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;            # app allows 5 MB files; a little room for the form fields
    client_body_timeout 30s;
    keepalive_timeout 30s;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/csv text/plain;

    include /etc/nginx/treeway/treeway-headers.conf;

    location /api/ {
        limit_req zone=treeway_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/treeway/treeway-proxy.conf;
    }
    # Public pictures are served by the app itself (only products / banners / company; private files need a login).
    location /uploads/ {
        include /etc/nginx/treeway/treeway-proxy.conf;
    }
    location / { return 404; }
}
