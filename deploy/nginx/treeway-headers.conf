# Security headers for every answer (included in the server block and in each location that has its own add_header,
# because nginx drops the server's add_header lines inside such a location).
# The CSP is the app's own policy (treeway_frontend/vite.config.ts `CSP`, also a <meta> in index.html) plus
# frame-ancestors. `npm run check:csp` in treeway_frontend opens every screen of the built app under it.
# tests/test_deploy_files.py checks this line matches the app's policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
