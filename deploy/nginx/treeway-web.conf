# /etc/nginx/sites-available/treeway-web  ->  ln -s ../sites-available/treeway-web /etc/nginx/sites-enabled/
# The app: https://treeway.avigronix.com  (treeway_frontend `npm run build` -> /home/treeway/web/dist)
# The app calls /api/v1 and /uploads on its OWN domain; nginx passes those to the API (gunicorn on this server).
# So: no CORS, the strict CSP (connect-src 'self') works, and the login token never goes to another domain.
# If the API ever runs on another machine, change the upstream in treeway-api.conf to that machine's private IP.
#
# Needs treeway-api.conf enabled too (it defines `upstream treeway_api` and the rate limit zone).
# HTTPS: sudo certbot --nginx -d treeway.avigronix.com
# Test and load: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name treeway.avigronix.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }   # certbot
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name treeway.avigronix.com;

    ssl_certificate     /etc/letsencrypt/live/treeway.avigronix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/treeway.avigronix.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/csv text/plain application/javascript text/css application/manifest+json image/svg+xml;

    include /etc/nginx/treeway/treeway-headers.conf;

    # ------------------------------------------------ API + pictures, passed to gunicorn
    location /api/ {
        limit_req zone=treeway_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/treeway/treeway-proxy.conf;
    }
    location /uploads/ {
        include /etc/nginx/treeway/treeway-proxy.conf;
    }

    # ------------------------------------------------ the app
    root /home/treeway/web/dist;

    # File names with a hash never change: cache for a year.
    location /assets/ {
        include /etc/nginx/treeway/treeway-headers.conf;   # add_header below would drop the server ones
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # The service worker, the page and the manifest must always be fresh, or members keep an old app.
    location ~ ^/(sw\.js|workbox-[A-Za-z0-9]+\.js|index\.html|manifest\.webmanifest)$ {
        include /etc/nginx/treeway/treeway-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Every app screen (/wallet, /join/TW1234567 ...) is the same index.html; the app picks the screen.
    location / {
        include /etc/nginx/treeway/treeway-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
