# Treeway's own Redis (never the shared one). /etc/redis/redis-treeway.conf, owner redis, chmod 640.
# Holds only short-lived data: OTP hashes (5 min), rate-limit counters, login locks, a 60 s user cache.
# Losing it on a restart is harmless (members just ask for a new OTP), so no disk persistence.

port 6380
bind 127.0.0.1 -::1
protected-mode yes
requirepass CHANGE-ME-LONG-RANDOM          # same as in REDIS_URL=redis://:<password>@127.0.0.1:6380/0

maxmemory 256mb
# Every Treeway key has an expiry; under memory pressure drop the ones closest to expiring first.
maxmemory-policy volatile-ttl

save ""
appendonly no

# Commands an attacker could abuse are renamed away (the app never uses them).
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command KEYS ""

timeout 300
tcp-keepalive 60
loglevel notice
logfile /var/log/redis/redis-treeway.log
dir /var/lib/redis-treeway
supervised systemd
